name: CI - Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Synchroniser les dependances
        run: uv sync --frozen

      - name: Executer les tests avec couverture
        run: |
          uv run python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Verifier la couverture minimale
        run: |
          uv run coverage report --fail-under=80